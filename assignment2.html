<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Feedback Form</h2>
  <form action="/action">
    <label>
        Your Name <br>
        <input type="text" placeholder="enter your name" >
        </label>
        <label>
            <br><br>


         E-mail Id: <br>
        <input type="email" placeholder="enter email id" >
        </label>
        <br><br>


        <label>
         Phone no.: <br>
        <input type="number" placeholder="enter phone number" >
        </label>
            <br><br>

            <label>Rate our service:</label><br>
        <input type="radio" id="excellent" name="rating" value="excellent">
        <label for="excellent">Excellent</label><br>
        
        <input type="radio" id="good" name="rating" value="good">
        <label for="good">Good</label><br>
        
        <input type="radio" id="poor" name="rating" value="poor">
        <label for="poor">Poor</label>
        <br><br>

        <label>What did you like the most?</label><br>
        <input type="checkbox" id="service" name="liked" value="service">
        <label for="service">Customer Service</label><br>
        
        <input type="checkbox" id="Response" name="liked" value="Response">
        <label for="Response">Response</label><br>
        
        <input type="checkbox" id="quality" name="liked" value="quality">
        <label for="quality">Quality</label>
        <br><br>

        Your Feedback: <br> 
        <input type="text" placeholder="your feedback" name="feedback" rows="4" cols="30">
        <br>
        <input type="submit" value="Submit Feedback">
        <input type="reset" value="Reset Form">
  </form>  
</body>
</html>
